[[inputs.kafka_consumer]]
  brokers = ["kafka:9092"]
  topics = ["machine-data"]
  consumer_group = "telegraf_metrics_consumers"
  offset = "oldest"
  max_message_len = 1000000
  data_format = "json"
  json_string_fields = ["machine_id"]
  tag_keys = ["machine_id"]

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "machine-data"
